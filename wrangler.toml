name = "gettingover"
compatibility_date = "2025-09-01"
main = "worker/index.ts"

assets = { directory = "./dist", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = true }

[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[[d1_databases]]
binding = "ART_DB"
database_name = "over-the-edge-art"
database_id = "54564bf2-9eb3-4d1b-828a-95fbd87faa63"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "ART_FILES"
bucket_name = "over-the-edge-art"

[triggers]
crons = ["* * * * *"]

# Custom domains are account-specific; configure your own in Cloudflare.
